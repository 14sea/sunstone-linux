# sunstone: MultiMedia1 (hw:N,0) plays on RX_CODEC_DMA_RX_0, MultiMedia3 (hw:N,2) records from
# TX_CODEC_DMA_TX_3 (DTS: sound node). The routes follow the stock mixer_paths_qrd.xml.

SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

# RX0 and RX1 (left, right) mixed into RX INT2 -> RDAC3 -> the WCD9370's AUX output -> the SIA8159
# amplifier (switched by its driver with the stream). The digital volume is fixed at the stock
# speaker value, 78 (-6 dB, which also covers the two channels' sum), and not exposed as a
# hardware volume: the desktop's volume is in software, so 100% is the stock maximum.
SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT2_1 MIX1 INP0' RX0"
		cset "name='RX INT2_1 MIX1 INP1' RX1"
		cset "name='RX_RX2 Digital Volume' 78"
		cset "name='RDAC3_MUX' RX3"
		cset "name='AUX_RDAC Switch' 1"
		cset "name='LO Switch' 1"
	]

	DisableSequence [
		cset "name='LO Switch' 0"
		cset "name='AUX_RDAC Switch' 0"
		cset "name='RX INT2_1 MIX1 INP1' ZERO"
		cset "name='RX INT2_1 MIX1 INP0' ZERO"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

# the main microphone, at the bottom: AMIC1 -> ADC1 -> TX SoundWire port 1 (SWR_MIC0) -> DEC0.
# ADC1 at the stock 12; the decimator 10 dB above 0 dB (84), as voice came in at about -37 dBFS peak.
SectionDevice."Mic" {
	Comment "Internal microphone"

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 94"
		cset "name='ADC1 Volume' 12"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
	]

	DisableSequence [
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 1
	}
}
