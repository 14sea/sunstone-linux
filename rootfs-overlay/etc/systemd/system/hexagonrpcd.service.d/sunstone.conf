# sunstone: the ADSP's sensor files from sunstone-fw-install; start once the ADSP is up
# (sunstone-adsp.service), the fastrpc device appears when its glink channel does
[Unit]
After=sunstone-adsp.service
Wants=sunstone-adsp.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 30); do [ -e /dev/fastrpc-adsp ] && exit 0; sleep 1; done; exit 1'
# the sensors PD rewrites its registry at every start: a private, writable copy of persist's
# (sunstone-fw-install's read-only one, copied on the first start and kept after that)
StateDirectory=hexagonrpcd
ExecStartPre=/bin/sh -c 'R=/var/lib/hexagonrpcd/sensors S=/usr/share/qcom/sm4375/Xiaomi/sunstone/sensors; \
	[ -d $R ] && exit 0; rm -rf $R.new; mkdir $R.new && cp -r $S/registry $R.new/registry && \
	cp $S/sns_reg_version $R.new/ && mv $R.new $R'
# the build with writes (tools/ubuntu/add-hexagonrpcd.sh), never the package's: with read-only files
# the PD fails and restarts the whole ADSP. -s: the sensors PD
ExecStart=
ExecStart=/usr/local/libexec/hexagonrpc/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -s \
	-R /usr/share/qcom/sm4375/Xiaomi/sunstone/ -W /var/lib/hexagonrpcd/sensors
Restart=on-failure
RestartSec=10
