# sunstone: the build with SSC support (tools/ubuntu/add-ssc.sh), which reaches the SSC over QRTR
# (upstream's unit allows AF_QIPCRTR since 3.9); the SSC needs hexagonrpcd's files to start
[Unit]
After=hexagonrpcd.service

[Service]
ExecStart=
ExecStart=/usr/local/libexec/iio-sensor-proxy
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_LOCAL AF_NETLINK AF_QIPCRTR
