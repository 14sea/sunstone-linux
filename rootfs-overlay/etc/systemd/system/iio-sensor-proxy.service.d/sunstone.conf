# sunstone: the build with SSC support (tools/ubuntu/add-ssc.sh), which reaches the SSC over QRTR
# (upstream's unit allows AF_QIPCRTR since 3.9); the SSC needs hexagonrpcd's files to start
[Unit]
After=hexagonrpcd.service

[Service]
# hexagonrpcd starting is not the SSC being up, and neither is the SSC's QRTR service (400): it
# exists seconds before the sensors register, while hexagonrpcd still serves the registry. Started
# before them, the proxy finds no sensors and does not look again (boot-158 and boot-174: no
# auto-rotate). Wait until libssc can open the accelerometer, as the proxy will, for up to two
# minutes (then start anyway; at once without libssc's ssccli); the start timeout covers the wait.
ExecStartPre=/bin/sh -c '[ -x /usr/local/bin/ssccli ] || exit 0; end=$$(($(date +%%s) + 120)); while [ $(date +%%s) -lt $$end ]; do timeout 5 /usr/local/bin/ssccli --sensor accelerometer --timeout 1 >/dev/null 2>&1 && exit 0; sleep 1; done; echo "SSC accelerometer not ready, starting anyway"; exit 0'
TimeoutStartSec=180
ExecStart=
ExecStart=/usr/local/libexec/iio-sensor-proxy
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_LOCAL AF_NETLINK AF_QIPCRTR
