# sunstone: systemd pets the APSS watchdog (qcom_wdt, DT watchdog@f410000) every 15 s; if PID 1 or
# the whole system stops, the watchdog resets the phone after 30 s and it boots Linux again (the
# shim leaves the PON reason alone). Shutdowns and reboots keep systemd's default RebootWatchdogSec.
[Manager]
RuntimeWatchdogSec=30s
