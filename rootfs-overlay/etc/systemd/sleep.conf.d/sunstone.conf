# sunstone: no suspend for now. gsd-power suspends after the idle timeout (s2idle), which drops the
# USB gadget and Wi-Fi, so the phone becomes unreachable until a key wakes it. With these off logind
# reports CanSuspend=no and gsd-power keeps to blanking the screen. Revisit with power management.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
