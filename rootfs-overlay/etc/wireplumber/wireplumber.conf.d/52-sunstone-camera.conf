# sunstone: cameras through libcamera only. CAMSS has twelve raw V4L2 capture nodes (RDI and PIX of
# each TFE) that give Bayer data of whatever the pipeline was last set to; as V4L2 cameras they would
# be listed next to (and before) the libcamera camera, which configures the pipeline and debayers.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
  }
}
