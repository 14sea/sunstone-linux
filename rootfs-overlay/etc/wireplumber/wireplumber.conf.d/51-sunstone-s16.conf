# sunstone: the sound card's PipeWire nodes in 16 bit. PipeWire picks S24_LE by default, and 24-bit
# streams through the ADSP's q6asm come out silent (boot-149: aplay S16_LE beeps audible and picked
# up by the microphone, the same in S24_LE not).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
      { node.name = "~alsa_input.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
