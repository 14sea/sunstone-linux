; A test access point on an ESP8266 (NodeMCU-style, CH340) for the phone's Wi-Fi reconnect tests,
; switched on and off over the serial port by tools/wifi-ap-test.sh.
;   AP_SSID=... AP_PASS=... pio run -t upload
; The credentials come from the environment, so they stay out of the repository.
[env:ap]
platform         = espressif8266
framework        = arduino
board            = nodemcuv2
upload_port      = /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0
upload_speed     = 115200   ; this board's CH340 loses bytes above ~230k
monitor_speed    = 115200
build_flags      = '-D AP_SSID="${sysenv.AP_SSID}"' '-D AP_PASS="${sysenv.AP_PASS}"'
